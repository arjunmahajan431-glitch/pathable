<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PathAble finds pedestrian routes that match your mobility needs and is honest about what the map does not know."
    />
    <title>PathAble | explainable pedestrian routing</title>
    <script>
      // Apply the saved theme before the first paint so the page does not flash.
      (function () {
        try {
          var stored = localStorage.getItem('pathable-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* localStorage can be blocked; the app still works in light mode. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
